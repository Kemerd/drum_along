<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1280" height="470" rx="24" fill="#1a1a19"/>
<text x="64" y="72" font-size="30" font-weight="700" letter-spacing="-.5" fill="#f0efec">119 songs it had never heard</text>
<text x="64" y="102" font-size="16" fill="#c3c2b7">How often it got it right, against exact MIDI.</text>
<circle cx="338" cy="132" r="7" fill="#1a1a19" stroke="#d95926" stroke-width="2.5"/>
<text x="354" y="137" font-size="14" fill="#c3c2b7">Hand-written only</text>
<circle cx="520" cy="132" r="8" fill="#3987e5"/>
<text x="536" y="137" font-size="14" fill="#c3c2b7">With the trained model</text>
<line x1="330.0" y1="160" x2="330.0" y2="378" stroke="#3a3a37" stroke-width="1"/>
<text x="330.0" y="400" text-anchor="middle" font-size="13" fill="#8f8e86">0%</text>
<line x1="460.0" y1="160" x2="460.0" y2="378" stroke="#3a3a37" stroke-width="1"/>
<text x="460.0" y="400" text-anchor="middle" font-size="13" fill="#8f8e86">25%</text>
<line x1="590.0" y1="160" x2="590.0" y2="378" stroke="#3a3a37" stroke-width="1"/>
<text x="590.0" y="400" text-anchor="middle" font-size="13" fill="#8f8e86">50%</text>
<line x1="720.0" y1="160" x2="720.0" y2="378" stroke="#3a3a37" stroke-width="1"/>
<text x="720.0" y="400" text-anchor="middle" font-size="13" fill="#8f8e86">75%</text>
<line x1="850.0" y1="160" x2="850.0" y2="378" stroke="#3a3a37" stroke-width="1"/>
<text x="850.0" y="400" text-anchor="middle" font-size="13" fill="#8f8e86">100%</text>
<text x="64" y="188" font-size="17" fill="#f0efec">Beats on the real beat</text>
<line x1="636.8" y1="182" x2="766.8" y2="182" stroke="#3987e5" stroke-width="2"/>
<circle cx="636.8" cy="182" r="8" fill="#1a1a19" stroke="#d95926" stroke-width="2.5"/>
<circle cx="766.8" cy="182" r="9" fill="#3987e5"/>
<text x="620.8" y="187" text-anchor="end" font-size="15" fill="#c3c2b7">59%</text>
<text x="782.8" y="187" font-size="15" font-weight="700" fill="#f0efec">84%</text>
<text x="64" y="246" font-size="17" fill="#f0efec">Right tempo</text>
<line x1="657.6" y1="240" x2="772.0" y2="240" stroke="#3987e5" stroke-width="2"/>
<circle cx="657.6" cy="240" r="8" fill="#1a1a19" stroke="#d95926" stroke-width="2.5"/>
<circle cx="772.0" cy="240" r="9" fill="#3987e5"/>
<text x="641.6" y="245" text-anchor="end" font-size="15" fill="#c3c2b7">63%</text>
<text x="788.0" y="245" font-size="15" font-weight="700" fill="#f0efec">85%</text>
<text x="64" y="304" font-size="17" fill="#f0efec">Snare on the right beats</text>
<line x1="527.6" y1="298" x2="735.6" y2="298" stroke="#3987e5" stroke-width="2"/>
<circle cx="527.6" cy="298" r="8" fill="#1a1a19" stroke="#d95926" stroke-width="2.5"/>
<circle cx="735.6" cy="298" r="9" fill="#3987e5"/>
<text x="511.6" y="303" text-anchor="end" font-size="15" fill="#c3c2b7">38%</text>
<text x="751.6" y="303" font-size="15" font-weight="700" fill="#f0efec">78%</text>
<text x="64" y="362" font-size="17" fill="#f0efec">The 1 on the real 1</text>
<line x1="460.0" y1="356" x2="688.8" y2="356" stroke="#3987e5" stroke-width="2"/>
<circle cx="460.0" cy="356" r="8" fill="#1a1a19" stroke="#d95926" stroke-width="2.5"/>
<circle cx="688.8" cy="356" r="9" fill="#3987e5"/>
<text x="444.0" y="361" text-anchor="end" font-size="15" fill="#c3c2b7">25%</text>
<text x="704.8" y="361" font-size="15" font-weight="700" fill="#f0efec">69%</text>
<rect x="950" y="64" width="266" height="342" rx="16" fill="#262624"/>
<text x="978" y="110" font-size="17" font-weight="600" fill="#f0efec">Stumbles per minute</text>
<text x="978" y="136" font-size="14" fill="#c3c2b7">The clock jumping mid-song</text>
<text x="978" y="260" font-size="88" font-weight="700" letter-spacing="-3" fill="#f0efec">0.1</text>
<text x="978" y="308" font-size="17" fill="#c3c2b7">down from 4.5</text>
<text x="978" y="364" font-size="14" fill="#8f8e86">About one every 10 minutes.</text>
<text x="64" y="442" font-size="14" fill="#8f8e86">Slakh2100 test songs, drums removed. No singing in this data, so real records are a harder test.</text>
</svg>
