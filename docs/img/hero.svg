<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  
  @keyframes hit { 0% { opacity: 1; transform: scale(1.22); } 18% { opacity: 1; transform: scale(1); } 45%, 100% { opacity: .42; transform: scale(1); } }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(576px); } }
  @keyframes wave { 0%, 100% { transform: scaleY(.45); } 12% { transform: scaleY(1); } }
  .hit { transform-box: fill-box; transform-origin: center; animation: hit 2.0s linear infinite; }
  .head { animation: sweep 2.0s linear infinite; }
  .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.0s ease-out infinite; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
